<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    <main>
    <div id = "box">
        <div id="display">
            
        </div>
        <div id="buttons">
            <button id = deleteAll class = "clear">AC</button>
            <button  id = "delete" class = "clear">C</button>
            <button class ="toShow function">/</button>
            <button class ="toShow function">%</button>
            <button class ="toShow">1</button>
            <button class ="toShow">2</button>
            <button class ="toShow">3</button>
            <button class ="toShow function">*</button>
            <button class ="toShow">4</button>
            <button class ="toShow">5</button>
            <button class ="toShow">6</button>
            <button class ="toShow function">+</button>
            <button class ="toShow">7</button>
            <button class ="toShow">8</button>
            <button class ="toShow">9</button>
            <button class ="toShow function">-</button>
            <button class ="toShow">0</button>
            <button class ="toShow point">.</button>
            <button id = "equalto">=</button>
        </div>
    </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
